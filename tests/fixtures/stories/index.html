<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Stories Fixture</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light;
      }
      body {
        font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        background: #f7f8fa;
        color: #111;
        margin: 0;
        padding: 0;
      }
      header {
        background: linear-gradient(90deg, #5b8def, #7f6bff);
        color: white;
        padding: 1.5rem 2rem;
      }
      main {
        max-width: 960px;
        margin: 2rem auto;
        padding: 0 1rem 2rem;
      }
      .story-card {
        background: white;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        padding: 1.5rem;
        margin-bottom: 1.5rem;
        border: 1px solid #e5e7eb;
      }
      .pill {
        display: inline-block;
        background: #eef2ff;
        color: #4338ca;
        border-radius: 999px;
        padding: 0.35rem 0.75rem;
        font-weight: 600;
        font-size: 0.85rem;
        margin-right: 0.5rem;
      }
    </style>
  </head>
  <body>
    <div id="storybook-root">
      <header>
        <h1>Storybook Fixture</h1>
        <p>外部 Storybook へのアクセスができない環境向けのスタブページです。</p>
      </header>
      <main>
        <section class="story-card">
          <h2>Button Component</h2>
          <p>主要な UI コンポーネントをここで確認できます。</p>
          <div>
            <span class="pill">Primary</span>
            <span class="pill">Secondary</span>
            <span class="pill">Disabled</span>
          </div>
        </section>
        <section class="story-card">
          <h2>Form Elements</h2>
          <p>入力フォームの状態やバリデーション表示を確認できます。</p>
          <div>
            <label>
              名前:
              <input type="text" placeholder="John Doe" />
            </label>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
