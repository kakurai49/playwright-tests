<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Stories Fixture</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        margin: 2rem;
        line-height: 1.6;
      }
      #storybook-root {
        border: 2px dashed #888;
        padding: 1.5rem;
        border-radius: 0.75rem;
        background: #f9fafb;
        color: #111;
      }
      h1 {
        margin-top: 0;
      }
      ul {
        padding-left: 1.4rem;
      }
      li {
        margin-bottom: 0.5rem;
      }
      code {
        background: #f1f5f9;
        padding: 0.2rem 0.35rem;
        border-radius: 0.35rem;
      }
    </style>
  </head>
  <body>
    <main id="storybook-root" aria-label="Stories fixture root">
      <h1>Stories Fixture</h1>
      <p>ローカル実行用の Storybook 代替ページです。</p>
      <ul>
        <li>外部 Stories に依存せずに <code>#storybook-root</code> を待機できます。</li>
        <li>RUN_EXTERNAL=1 を指定した場合のみ外部 Stories にアクセスします。</li>
      </ul>
      <section>
        <h2>サンプル Story</h2>
        <article>
          <h3>Button</h3>
          <button type="button">Default Button</button>
        </article>
      </section>
    </main>
  </body>
</html>
