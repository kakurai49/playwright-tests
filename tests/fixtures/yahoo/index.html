<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Yahoo Fixture</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        margin: 2rem;
        line-height: 1.6;
        background: #f8fafc;
        color: #0f172a;
      }
      header {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-bottom: 1.5rem;
      }
      [data-testid='yahoo-logo'] {
        width: 160px;
        height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 0.5rem;
        background: #6001d2;
        color: #fff;
        font-weight: 700;
        letter-spacing: 0.03em;
      }
      main {
        padding: 1.5rem;
        border: 1px solid #cbd5e1;
        border-radius: 0.75rem;
        background: #fff;
      }
      form {
        display: flex;
        gap: 0.5rem;
      }
      input[type='search'] {
        flex: 1;
        padding: 0.6rem 0.75rem;
        border-radius: 0.5rem;
        border: 1px solid #cbd5e1;
      }
      button {
        padding: 0.6rem 1rem;
        border-radius: 0.5rem;
        border: 1px solid #cbd5e1;
        background: #e0e7ff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header>
      <div data-testid="yahoo-logo" aria-label="Yahoo! Japan Logo">Yahoo!</div>
      <strong>Yahoo Fixture</strong>
    </header>
    <main>
      <form aria-label="Fixture search form">
        <input type="search" placeholder="検索キーワードを入力" />
        <button type="submit">検索</button>
      </form>
      <section>
        <h2>ニュースの例</h2>
        <ul>
          <li>ネットワーク依存なしで UI の存在チェックが可能です。</li>
          <li>RUN_EXTERNAL=1 の場合のみ実サイトへアクセスします。</li>
        </ul>
      </section>
    </main>
  </body>
</html>
