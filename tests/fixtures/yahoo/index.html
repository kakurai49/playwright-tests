<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Yahoo Fixture</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        font-family: Arial, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
        margin: 0;
        background: #f5f7fb;
        color: #111;
      }
      header {
        background: #410093;
        color: white;
        padding: 1.2rem 2rem;
      }
      main {
        max-width: 960px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      .headline {
        background: white;
        padding: 1rem 1.5rem;
        border-radius: 10px;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
        border: 1px solid #e5e7eb;
      }
      .headline h2 {
        margin-top: 0;
      }
      nav ul {
        display: flex;
        gap: 1rem;
        list-style: none;
        padding: 0;
      }
      nav a {
        color: white;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 data-testid="yahoo-logo">Yahoo! Fixture</h1>
      <nav>
        <ul>
          <li><a href="#news">ニュース</a></li>
          <li><a href="#shopping">ショッピング</a></li>
          <li><a href="#mail">メール</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section class="headline" id="news">
        <h2>主要なニュースの見出しをここに表示します。</h2>
        <p>外部 Yahoo! へ到達できない場合の確認用コンテンツです。</p>
      </section>
    </main>
  </body>
</html>
